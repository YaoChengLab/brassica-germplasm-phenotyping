<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>品系生長曲線 — leaf-canopy-qc</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 13px; display: flex; height: 100vh; overflow: hidden; }

  #side { width: 185px; flex: 0 0 185px; border-right: 1px solid #ccc; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .nav a { color: #36c; text-decoration: none; font-size: 11px; }
  .nav a:hover { text-decoration: underline; }
  .btn-row { display: flex; gap: 4px; }
  .btn-row button { flex: 1; font-size: 12px; padding: 2px 4px; cursor: pointer; }
  label.inline { display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 12px; }
  #status { font-size: 11px; color: #888; min-height: 15px; }

  #cultTree { flex: 1; min-height: 0; overflow-y: auto; border: 1px solid #ddd; border-radius: 3px; }
  .batch-hdr { display: flex; align-items: center; gap: 4px; padding: 3px 6px;
               background: #efefef; border-bottom: 1px solid #ddd;
               cursor: pointer; font-weight: bold; font-size: 12px; user-select: none; }
  .batch-hdr:hover { background: #e4e4f4; }
  .batch-hdr input[type=checkbox] { cursor: pointer; flex: 0 0 auto; }
  .batch-hdr .arrow { font-size: 10px; color: #888; }
  .cult-list { display: none; }
  .cult-list.open { display: block; }
  .cult-list label { display: flex; align-items: center; gap: 5px; padding: 2px 6px 2px 24px;
                     font-size: 12px; cursor: pointer; }
  .cult-list label:hover { background: #eef; }
  .cult-list label input { cursor: pointer; }

  #main { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; }

  .ccard { border: 1px solid #ddd; border-radius: 4px; background: #fff; flex: 1 1 400px; max-width: 560px; }
  .ccard-hdr { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding: 3px 8px;
               background: #f3f3f3; border-bottom: 1px solid #e0e0e0; border-radius: 4px 4px 0 0;
               font-weight: bold; font-size: 12px; }
  .status-tag { margin-left: auto; font-size: 10px; color: #999; font-weight: normal; }
  .ccard-charts { display: flex; height: 175px; }
  .ccard-charts svg { flex: 1; min-width: 0; background: #fafafa; }
  .ccard-charts svg + svg { border-left: 1px solid #e8e8e8; }
  .leg-item { font-size: 10px; display: flex; align-items: center; gap: 3px; white-space: nowrap; }
  .leg-sw { width: 14px; height: 2.5px; border-radius: 1px; display: inline-block; flex: 0 0 14px; }
</style>
</head>
<body>
<div id="side">
  <div class="nav"><a href="/">← 歸屬審查</a></div>
  <b>品系生長曲線</b>
  <div class="btn-row">
    <button id="selAllBtn">全選</button>
    <button id="clrBtn">清除</button>
  </div>
  <label class="inline"><input type="checkbox" id="dapdChk" checked> 排除子葉（DAPD）</label>
  <div id="status">—</div>
  <div id="cultTree"></div>
</div>
<div id="main"></div>

<script>
const $ = s => document.querySelector(s);
const COLORS = ['#e41a1c','#377eb8','#4daf4a','#984ea3','#ff7f00','#a65628','#f781bf','#888888'];
let treeData = null, updateTimer = null;
const cardMap = new Map(); // "batch:cult" → card DOM element

/* ── 初始化 ── */
async function init() {
  treeData = await (await fetch('/api/tree')).json();
  buildTree();
  for (const p of ['2025B08','2025B09']) {
    const sec = document.querySelector(`[data-batch="${p}"]`);
    if (sec) { openBatch(sec, true); precheck(sec, 6); break; }
  }
  if (!document.querySelector('[data-batch].opened'))
    document.querySelectorAll('[data-batch]').forEach((s,i) => { if(i===0){openBatch(s,true);precheck(s,6);} });
  handleChange();
}

/* ── Checkbox 樹 ── */
function buildTree() {
  const tree = $('#cultTree');
  tree.innerHTML = '';
  for (const batch of Object.keys(treeData).sort()) {
    const cults = Object.keys(treeData[batch]).sort();
    const sec = document.createElement('div');
    sec.dataset.batch = batch;

    const hdr = document.createElement('div'); hdr.className = 'batch-hdr';
    const bChk = document.createElement('input'); bChk.type = 'checkbox';
    const arrow = document.createElement('span'); arrow.className = 'arrow'; arrow.textContent = '▸';
    const lbl = document.createElement('span'); lbl.textContent = batch.slice(4);
    hdr.appendChild(bChk); hdr.appendChild(arrow); hdr.appendChild(lbl);

    const list = document.createElement('div'); list.className = 'cult-list';
    for (const cult of cults) {
      const row = document.createElement('label');
      const chk = document.createElement('input');
      chk.type = 'checkbox'; chk.value = `${batch}:${cult}`;
      chk.addEventListener('change', () => { syncBatchChk(bChk, list); scheduleUpdate(); });
      row.appendChild(chk); row.appendChild(document.createTextNode(cult));
      list.appendChild(row);
    }

    hdr.addEventListener('click', e => {
      if (e.target === bChk) return;
      list.classList.toggle('open');
      arrow.textContent = list.classList.contains('open') ? '▾' : '▸';
    });
    bChk.addEventListener('change', () => {
      list.querySelectorAll('input').forEach(c => c.checked = bChk.checked);
      bChk.indeterminate = false;
      scheduleUpdate();
    });

    sec.appendChild(hdr); sec.appendChild(list);
    tree.appendChild(sec);
  }
}

function openBatch(sec, open) {
  const list = sec.querySelector('.cult-list'), arrow = sec.querySelector('.arrow');
  list.classList.toggle('open', open);
  arrow.textContent = open ? '▾' : '▸';
  if (open) sec.classList.add('opened');
}
function precheck(sec, n) {
  [...sec.querySelectorAll('.cult-list input')].slice(0, n).forEach(c => c.checked = true);
  syncBatchChk(sec.querySelector('.batch-hdr input'), sec.querySelector('.cult-list'));
}
function syncBatchChk(bChk, list) {
  const all = [...list.querySelectorAll('input')], n = all.filter(c => c.checked).length;
  bChk.checked = n > 0 && n === all.length;
  bChk.indeterminate = n > 0 && n < all.length;
}

/* ── 增量更新排程 ── */
function scheduleUpdate() {
  clearTimeout(updateTimer);
  updateTimer = setTimeout(handleChange, 120);
}

/* ── 核心：只增 / 只刪，不重渲染已存在的卡 ── */
function handleChange() {
  const checked = new Set(
    [...document.querySelectorAll('#cultTree .cult-list input:checked')].map(c => c.value)
  );
  const allOpts = [...document.querySelectorAll('#cultTree .cult-list input')].map(c => c.value);
  const ex = $('#dapdChk').checked ? '&exclude_class=cotyledon' : '';

  // 移除已取消勾選的卡
  for (const [key, el] of [...cardMap]) {
    if (!checked.has(key)) { el.remove(); cardMap.delete(key); }
  }

  // 新增剛勾選的卡（按樹狀順序插入）
  for (const key of allOpts) {
    if (!checked.has(key) || cardMap.has(key)) continue;
    const i = key.indexOf(':');
    const batch = key.slice(0, i), cult = key.slice(i + 1);
    const card = makePlaceholder(`${batch.slice(4)} · ${cult}`, key);
    insertInOrder(card, key, allOpts);
    cardMap.set(key, card);
    fetchCard(card, batch, cult, ex);
  }

  $('#status').textContent = cardMap.size ? `顯示 ${cardMap.size} 品系` : '未勾選品系';
}

function makePlaceholder(title, key) {
  const uid = key.replace(/[^a-z0-9]/gi, '_');
  const card = document.createElement('div');
  card.className = 'ccard'; card.dataset.key = key;
  card.innerHTML =
    `<div class="ccard-hdr">
       <span>${title}</span>
       <span id="leg-${uid}" style="display:flex;gap:6px;flex-wrap:wrap"></span>
       <span class="status-tag" id="st-${uid}">載入中…</span>
     </div>
     <div class="ccard-charts">
       <svg id="cc-${uid}"></svg><svg id="ca-${uid}"></svg>
     </div>`;
  return card;
}

function insertInOrder(card, key, allOpts) {
  const main = $('#main'), pos = allOpts.indexOf(key);
  for (const el of main.querySelectorAll('.ccard')) {
    if (allOpts.indexOf(el.dataset.key) > pos) { main.insertBefore(card, el); return; }
  }
  main.appendChild(card);
}

async function fetchCard(card, batch, cult, ex) {
  const uid = `${batch}:${cult}`.replace(/[^a-z0-9]/gi, '_');
  try {
    const data = await fetch(
      `/api/cultivar_curves?batch=${encodeURIComponent(batch)}&cultivar=${encodeURIComponent(cult)}${ex}`
    ).then(r => r.json());
    const reps = data.replicates || [];
    // 卡片可能已被移除（載入期間取消勾選）
    if (!document.getElementById(`cc-${uid}`)) return;
    document.getElementById(`st-${uid}`).textContent = reps.length ? `${reps.length} rep` : '無資料';
    if (!reps.length) return;
    document.getElementById(`leg-${uid}`).innerHTML = reps.map((r, i) =>
      `<span class="leg-item"><span class="leg-sw" style="background:${COLORS[i%COLORS.length]}"></span>${r.plant}</span>`
    ).join('');
    lineChart(document.getElementById(`cc-${uid}`), '葉片數', reps, 'count');
    lineChart(document.getElementById(`ca-${uid}`), '葉面積(px)', reps, 'area');
  } catch(e) {
    const st = document.getElementById(`st-${uid}`);
    if (st) st.textContent = '錯誤';
  }
}

/* ── DAPD 切換：清空所有卡重新載入（資料變了）── */
$('#dapdChk').addEventListener('change', () => {
  for (const [, el] of [...cardMap]) el.remove();
  cardMap.clear();
  handleChange();
});

/* ── 全選 / 清除 ── */
$('#selAllBtn').onclick = () => {
  document.querySelectorAll('#cultTree .cult-list input').forEach(c => c.checked = true);
  document.querySelectorAll('#cultTree .batch-hdr input').forEach(c => { c.checked = true; c.indeterminate = false; });
  handleChange();
};
$('#clrBtn').onclick = () => {
  document.querySelectorAll('#cultTree input').forEach(c => { c.checked = false; c.indeterminate = false; });
  for (const [, el] of [...cardMap]) el.remove();
  cardMap.clear();
  $('#status').textContent = '—';
};

/* ── 折線圖 ── */
function fmtY(v) {
  return v >= 10000 ? (v/1000).toFixed(0)+'k' : v >= 1000 ? (v/1000).toFixed(1)+'k'
       : Number.isInteger(v) ? v : v.toFixed(1);
}
function lineChart(svg, yLabel, reps, field) {
  const W = svg.clientWidth || 480, H = svg.clientHeight || 175;
  const L=42, R=8, T=16, B=26;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const allDays = reps.flatMap(r => r.days);
  if (!allDays.length) { svg.innerHTML = ''; return; }
  const xmin = Math.min(...allDays.map(d => d.daf)), xmax = Math.max(...allDays.map(d => d.daf));
  const ymax = Math.max(1, ...allDays.map(d => d[field] || 0));
  const sx = x => L + (xmax===xmin ? 0 : (x-xmin)/(xmax-xmin)) * (W-L-R);
  const sy = y => (H-B) - (y/ymax) * (H-B-T);
  let s = `<text x="${L+2}" y="12" font-size="10" font-weight="bold" fill="#555">${yLabel}</text>`;
  for (const f of [0, 0.5, 1]) {
    const yv=ymax*f, y=sy(yv);
    s += `<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="${f?'#eee':'#ccc'}"/>`;
    s += `<text x="${L-3}" y="${(y+3).toFixed(1)}" font-size="8" text-anchor="end" fill="#777">${fmtY(yv)}</text>`;
  }
  const nT = Math.min(8, xmax-xmin+1);
  for (let t=0; t<nT; t++) {
    const xv=Math.round(xmin+(xmax-xmin)*t/Math.max(1,nT-1)), x=sx(xv);
    s += `<line x1="${x.toFixed(1)}" y1="${H-B}" x2="${x.toFixed(1)}" y2="${H-B+3}" stroke="#ccc"/>`;
    s += `<text x="${x.toFixed(1)}" y="${H-B+11}" font-size="8" text-anchor="middle" fill="#888">${xv}</text>`;
  }
  s += `<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="#ccc"/>`;
  s += `<text x="${((L+W-R)/2).toFixed(0)}" y="${H-1}" font-size="8" text-anchor="middle" fill="#bbb">DAF</text>`;
  for (let i=0; i<reps.length; i++) {
    const col = COLORS[i%COLORS.length];
    const pts = reps[i].days.map(d => ({ x:d.daf, y:d[field]??0, date:d.date }));
    if (!pts.length) continue;
    s += `<path d="${pts.map((p,j)=>(j?'L':'M')+sx(p.x).toFixed(1)+','+sy(p.y).toFixed(1)).join(' ')}" fill="none" stroke="${col}" stroke-width="1.8" opacity="0.85"/>`;
    for (const p of pts)
      s += `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="2" fill="${col}" opacity="0.7">`
         + `<title>${reps[i].plant}  DAF ${p.x} (${p.date}): ${fmtY(p.y)}</title></circle>`;
  }
  svg.innerHTML = s;
}

init();
</script>
</body>
</html>
